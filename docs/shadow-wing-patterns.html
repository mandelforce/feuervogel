<p>A model of the wing's fire with the game's own timings, bullet speeds and sway (Normal, loop 0). The ship sways under it. The patterns of levels 2 to 6 are proposals, not in the game. Peak counts are from this model, not from the game.</p>

    const [pk, pa] = peakOf(L); let t0 = lv.fireAt; while (t0 < 500) t0 += lv.per;
    const snaps = [[t0 + 25, 'just fired'], [t0 + 110, 'in flight'], [pa, 'peak: ' + pk + ' bullets']];
    snaps.forEach(([f, lab], r) => { const ox = 6 + L * cw, oy = 72 + r * gh; drawSim(g, simTo(L, f), ox, oy, sc); g.fillStyle = '#fff'; g.fillText(r === 0 ? lv.n : '', ox, oy - 4); g.fillStyle = '#9aa0a6'; g.fillText(lab, ox, oy + H + 14); });
  });
}
// the page
const cv = document.getElementById('cv'), g = cv.getContext('2d'), sl = document.getElementById('sl'), info = document.getElementById('info'), lvb = document.getElementById('lv');
cv.width = W * 2; cv.height = H * 2; let cur = 0, sim = mkSim(0), playing = true;
LV.forEach((lv, i) => { const b = document.createElement('button'); b.textContent = lv.n; b.onclick = () => { cur = i; sim = mkSim(i); sl.value = 0; ui(); }; lvb.appendChild(b); });
function ui() { [...lvb.children].forEach((b, i) => b.classList.toggle('on', i === cur)); }
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; e.target.classList.toggle('on', playing); };
sl.oninput = () => { sim = simTo(cur, +sl.value); playing = false; document.getElementById('play').textContent = 'Play'; document.getElementById('play').classList.remove('on'); };
document.getElementById('sheet').onclick = async () => { const c = document.createElement('canvas'); await drawSheet(c); c.style.maxWidth = '100%'; document.body.appendChild(c); c.scrollIntoView(); };
function frame() {
  if (playing) { stepSim(sim); if (sim.mt > 1600) sim = mkSim(cur); sl.value = sim.mt; }
  if (imgs[LV[cur].sp]) { g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height); drawSim(g, sim, 0, 0, 2); }
  const lv = LV[cur], cache = peakOf.c2 = peakOf.c2 || {}; if (!cache[cur]) cache[cur] = peakOf(cur);
  info.innerHTML = '<b>' + lv.n + '</b><br>new: ' + lv.nw + '<br>frame ' + sim.mt + '<br>bullets now: ' + sim.b.length + '<br>peak (frames 300 to 1600): ' + cache[cur][0] + ' (budget about 57)<br><br>' + Object.entries(SRC).map(([k, v]) => '<span class="k" style="background:' + v[0] + '"></span>' + v[1]).join('<br>');
  requestAnimationFrame(frame);
}
ui(); ready.then(frame);
</script>
