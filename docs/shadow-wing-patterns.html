<h1>Shadow Wing: pattern sequence per ship</h1>
<p>Each ship runs its own sequence, one state at a time. The barrels glow, then fire; the next state starts when the screen is clear. A model with the game's bullet speeds and sway (Normal, loop 0). Levels 2 to 6 are proposals.</p>
